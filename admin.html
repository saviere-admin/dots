<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dots. | Secure Node</title>
    <style>
        :root {
            --bg: #111111;
            --surface: #ffffff;
            --text-main: #111827;
            --border: #e5e7eb;
            --ios-blue: #007aff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* macOS Style Auth Overlay matching image_b1c5e5.png */
        #authContainer {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popIn 0.2s ease-out;
            overflow: hidden;
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .auth-top {
            padding: 20px;
            text-align: center;
        }
        .auth-logo {
            max-width: 80px;
            margin-bottom: 15px;
            background: #000;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .auth-top p {
            margin: 0 0 15px 0;
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }
        input.auth-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #8e8e93;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        input.auth-input:focus {
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 1px var(--ios-blue);
        }
        .auth-buttons {
            display: flex;
            border-top: 1px solid #dbdbdf;
        }
        .auth-buttons button {
            flex: 1;
            background: transparent;
            color: var(--ios-blue);
            border: none;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            padding: 12px;
            transition: background 0.1s;
        }
        .auth-buttons button:hover { background: #f0f0f0; }
        .auth-buttons button:last-child {
            font-weight: 600;
            border-left: 1px solid #dbdbdf;
        }
        
        .auth-footer {
            background-color: #f9fafb;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 10px;
            color: #6b7280;
            border-top: 1px solid #dbdbdf;
        }
        .cf-logo { width: 14px; height: 14px; fill: #F38020; }

        /* Dashboard Global Styles (Injected post-auth) */
        .dash-body { background-color: #f9fafb; padding: 40px 20px; display: block; height: auto; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
        .logo-container { background-color: #000; padding: 15px; border-radius: 8px; display: inline-flex; }
        .logo { max-width: 120px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card h2 { margin-top: 0; font-size: 1.25rem; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; }
        .dash-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        textarea.dash-input { resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; }
        .action-btn { background-color: #000; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .action-btn:hover { opacity: 0.8; }
        .logout-btn { margin-left: auto; background: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-main); }
        .dash-footer { text-align: center; color: #6b7280; font-size: 12px; margin-top: 40px; }
    </style>
</head>
<body>

    <div id="authContainer">
        <form id="authForm">
            <div class="auth-top">
                <img src="https://usedots.in/public/brand/logos/dh/DotsTBWTWoS.png" alt="dots." class="auth-logo">
                <p>Please enter the Editorial Passcode to access this node:</p>
                <input type="password" id="modalPassword" class="auth-input" placeholder="Admin Password" required>
                <input type="password" id="modalPat" class="auth-input" placeholder="GitHub PAT" required>
            </div>
            <div class="auth-buttons">
                <button type="button" onclick="window.location.reload()">Cancel</button>
                <button type="submit">OK</button>
            </div>
            <div class="auth-footer">
                <svg class="cf-logo" viewBox="0 0 31.11 10.37" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56,3.87a4,4,0,0,0-3.79-2.73,4.09,4.09,0,0,0-1.61.33,3.31,3.31,0,0,0-6.19.78,2.71,2.71,0,0,0-2.48-1.55,2.77,2.77,0,0,0-2.33,1.26A2.81,2.81,0,0,0,5.7,1.84,2.86,2.86,0,0,0,3.31,3,3.58,3.58,0,0,0,0,6.59v.5H23.09v-.5A3.54,3.54,0,0,0,22.56,3.87Z"/>
                    <path d="M31.11,6.59a3.57,3.57,0,0,0-2.61-3.41,2.83,2.83,0,0,0-3-1.34h0a3.33,3.33,0,0,0-.31,1.15,2.74,2.74,0,0,1,1,2.5,2.86,2.86,0,0,1-1.38,2h.1A2.58,2.58,0,0,1,27.35,8H31.11Z"/>
                    <rect x="0" y="7.5" width="26.79" height="2.87"/>
                </svg>
                Secured by Cloudflare
            </div>
        </form>
    </div>

    <!-- Note the corrected script path (no leading slash) -->
    <script src="admin.js"></script>
</body>
</html>
