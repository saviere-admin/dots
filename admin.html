<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dots. | System Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style> body { font-family: 'Poppins', sans-serif; background-color: #0a0a0a; color: white; } .hidden { display: none !important; } </style>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden flex items-center justify-center">

    <!-- Step 1: System Password Modal -->
    <div id="passwordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0a0a]">
        <div class="bg-[#111] border border-gray-800 p-10 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <img src="https://usedots.in/public/brand/logos/dh/DotsTBWTWoS.png" alt="dots." class="h-8 mx-auto mb-8 opacity-80 object-contain">
            <h2 class="text-xs font-bold tracking-[0.2em] uppercase text-gray-500 mb-6">Restricted Access</h2>
            
            <input type="password" id="sysPasswordInput" placeholder="Enter Admin Password" class="w-full bg-black border border-gray-800 rounded-lg px-4 py-4 text-white text-center mb-4 focus:outline-none focus:border-gray-500">
            <button id="sysPasswordBtn" class="w-full bg-white text-black font-semibold py-4 rounded-lg hover:bg-gray-200 transition">Unlock Protocol</button>
            <p id="pwdError" class="text-red-500 text-xs mt-4 hidden">Invalid Authorization Code</p>
        </div>
    </div>

    <!-- Step 2: GitHub PAT Auth -->
    <div id="githubView" class="hidden w-full max-w-md text-center p-8">
        <h1 class="text-3xl font-bold tracking-tight mb-2">Protocol Unlocked</h1>
        <p class="text-gray-400 mb-8">Enter GitHub PAT for <span class="text-white font-mono">saviere-admin</span>.</p>
        
        <form id="patForm" class="space-y-4">
            <input type="password" id="githubToken" required placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full px-5 py-4 bg-[#111] border border-gray-800 rounded-xl focus:outline-none focus:border-gray-500 text-center font-mono">
            <button type="submit" id="patBtn" class="w-full bg-white text-black font-semibold py-4 rounded-xl hover:bg-gray-200 transition">
                Connect Backend
            </button>
        </form>
        <p id="patError" class="text-red-500 text-sm mt-6 hidden"></p>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden fixed inset-0 bg-[#FAFAFA] text-black overflow-y-auto">
        <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <img src="https://usedots.in/public/brand/logos/dh/DotsTBBTWoS.png" alt="dots." class="h-6 w-auto object-contain">
            <button id="logoutBtn" class="text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-700">Lock Console</button>
        </nav>

        <div class="p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white rounded-3xl border border-gray-100 p-8">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-2xl font-bold tracking-tight">Waitlist Database</h2>
                    <span id="waitlistCount" class="bg-black text-white text-sm font-bold px-4 py-2 rounded-full">0</span>
                </div>
                <div class="overflow-y-auto max-h-[500px]">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-400 uppercase tracking-wider sticky top-0 bg-white pb-2">
                            <tr>
                                <th class="py-3 font-semibold">Email Target</th>
                                <th class="py-3 font-semibold text-right">Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="waitlistTableBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-[#111] text-white rounded-3xl border border-gray-800 p-8">
                <h2 class="text-xl font-bold tracking-tight mb-8">Broadcast Engine</h2>
                <div id="notifyStatus" class="hidden text-sm p-4 rounded-xl mb-6"></div>
                <form id="notifyForm" class="space-y-5">
                    <input type="text" id="emailSubject" required placeholder="Subject Line" class="w-full px-4 py-3 bg-black border border-gray-800 rounded-xl focus:outline-none focus:border-gray-500 text-white">
                    <textarea id="emailBody" required rows="6" placeholder="HTML Body Content..." class="w-full px-4 py-3 bg-black border border-gray-800 rounded-xl focus:outline-none focus:border-gray-500 text-white font-mono text-sm"></textarea>
                    <button type="submit" id="sendBtn" class="w-full bg-white text-black font-semibold py-4 rounded-xl hover:bg-gray-200">Dispatch Payload</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
