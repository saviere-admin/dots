<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dots. | System Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-gray-900 antialiased">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center fixed w-full top-0 z-50">
        <div class="flex items-center gap-3">
            <!-- Referencing existing logo -->
            <img src="/public/brand/logos/primary/dots-primary.svg" alt="dots. logo" class="h-6">
            <span class="text-sm font-semibold tracking-widest uppercase text-gray-400 border-l border-gray-200 pl-3">Admin Console</span>
        </div>
        <button id="logoutBtn" class="hidden text-sm font-medium text-red-500 hover:text-red-700">Lock Console</button>
    </nav>

    <!-- Login View -->
    <main id="loginView" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-10 rounded-2xl shadow-sm border border-gray-200 w-full max-w-md">
            <h1 class="text-2xl font-bold mb-2">System Authorization</h1>
            <p class="text-sm text-gray-500 mb-8">Level 2 Security Clearance Required.</p>
            
            <div id="loginError" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-6 border border-red-100"></div>

            <form id="authForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Admin Password</label>
                    <input type="password" id="adminPwd" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">GitHub PAT (saviere-admin)</label>
                    <input type="password" id="githubToken" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-black text-white font-medium py-3 rounded-lg hover:bg-gray-800 transition shadow-md mt-4">
                    Authenticate
                </button>
            </form>
        </div>
    </main>

    <!-- Dashboard View -->
    <main id="dashboardView" class="hidden pt-24 pb-12 px-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Col: Waitlist Database -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-semibold">Waitlist Database</h2>
                    <span id="waitlistCount" class="bg-black text-white text-xs font-bold px-3 py-1 rounded-full">0 Users</span>
                </div>
                <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-500 uppercase bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-6 py-3 font-medium">Email</th>
                                <th class="px-6 py-3 font-medium">Source</th>
                                <th class="px-6 py-3 font-medium">Joined Date</th>
                            </tr>
                        </thead>
                        <tbody id="waitlistTableBody" class="divide-y divide-gray-100">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Col: Notification Publisher -->
        <div class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-semibold mb-1">Broadcast Notification</h2>
                <p class="text-xs text-gray-500 mb-6">Dispatch email to entire waitlist via Resend.</p>
                
                <div id="notifyStatus" class="hidden text-sm p-3 rounded-lg mb-4"></div>

                <form id="notifyForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Subject Line</label>
                        <input type="text" id="emailSubject" required placeholder="e.g. dots. is now live." class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-black transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Email Body (HTML supported)</label>
                        <textarea id="emailBody" required rows="8" placeholder="<h1>Hello from dots.</h1>..." class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-black transition"></textarea>
                    </div>
                    <button type="submit" id="sendBtn" class="w-full bg-blue-600 text-white font-medium py-3 rounded-lg hover:bg-blue-700 transition shadow-sm">
                        Send Broadcast
                    </button>
                </form>
            </div>
        </div>

    </main>

    <script src="/admin.js"></script>
</body>
</html>
