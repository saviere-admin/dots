<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dots. | Restricted Node</title>
    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #000000;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        
        /* Auth Overlay Styling */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .auth-modal {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            box-sizing: border-box;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .auth-header {
            background-color: #000000;
            padding: 24px;
            text-align: center;
        }
        .auth-logo {
            max-width: 120px;
        }
        .auth-body {
            padding: 30px 24px 20px;
        }
        .auth-body p {
            margin: 0 0 20px 0;
            font-size: 15px;
            color: var(--text-main);
            font-weight: 500;
            text-align: center;
        }
        .auth-modal input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-modal input:focus {
            border-color: #000000;
        }
        .auth-buttons {
            display: flex;
            margin-top: 10px;
        }
        .auth-buttons button {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        .auth-buttons button:hover { opacity: 0.8; }
        
        /* Cloudflare Footer */
        .auth-footer {
            background-color: #f9fafb;
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .cf-logo {
            width: 20px;
            height: 20px;
            fill: #F38020;
        }

        /* Main App Styling */
        #mainApp { display: none; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
        .logo-container { background-color: #000; padding: 15px; border-radius: 8px; display: inline-flex; }
        .logo { max-width: 120px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card h2 { margin-top: 0; font-size: 1.25rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; }
        .action-btn { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .action-btn:hover { opacity: 0.8; }
        .logout-btn { margin-left: auto; background: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .logout-btn:hover { background: #f3f4f6; }
    </style>
</head>
<body>

    <!-- Security Overlay -->
    <div id="authOverlay">
        <div class="auth-modal">
            <div class="auth-header">
                <img src="https://usedots.in/public/brand/logos/dh/DotsTBWTWoS.png" alt="dots." class="auth-logo">
            </div>
            <div class="auth-body">
                <p>Restricted Node Access</p>
                <form id="authForm">
                    <input type="password" id="modalPassword" placeholder="Admin Password" required>
                    <input type="password" id="modalPat" placeholder="GitHub PAT" required>
                    <div class="auth-buttons">
                        <button type="submit">Authenticate</button>
                    </div>
                </form>
            </div>
            <div class="auth-footer">
                <!-- Cloudflare Logo SVG -->
                <svg class="cf-logo" viewBox="0 0 31.11 10.37" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56,3.87a4,4,0,0,0-3.79-2.73,4.09,4.09,0,0,0-1.61.33,3.31,3.31,0,0,0-6.19.78,2.71,2.71,0,0,0-2.48-1.55,2.77,2.77,0,0,0-2.33,1.26A2.81,2.81,0,0,0,5.7,1.84,2.86,2.86,0,0,0,3.31,3,3.58,3.58,0,0,0,0,6.59v.5H23.09v-.5A3.54,3.54,0,0,0,22.56,3.87Z"/>
                    <path d="M31.11,6.59a3.57,3.57,0,0,0-2.61-3.41,2.83,2.83,0,0,0-3-1.34h0a3.33,3.33,0,0,0-.31,1.15,2.74,2.74,0,0,1,1,2.5,2.86,2.86,0,0,1-1.38,2h.1A2.58,2.58,0,0,1,27.35,8H31.11Z"/>
                    <rect x="0" y="7.5" width="26.79" height="2.87"/>
                </svg>
                Secured by Cloudflare
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="mainApp">
        <div class="container">
            <div class="header">
                <div class="logo-container">
                    <img src="https://usedots.in/public/brand/logos/dh/DotsTBWTWoS.png" alt="dots. logo" class="logo">
                </div>
                <h1>Communication Console</h1>
                <button class="logout-btn" id="logoutBtn">Lock Console</button>
            </div>

            <!-- System Notifications & Waitlist -->
            <div class="card">
                <h2>Waitlist & System Notifications</h2>
                <form id="waitlistForm">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="wlSubject" placeholder="Update from dots." required>
                    </div>
                    <div class="form-group">
                        <label>Select Recipients (Hold CMD/CTRL to select multiple)</label>
                        <select id="wlRecipients" multiple size="3">
                            <option value="all">Entire Waitlist Database</option>
                            <option value="cohort_1">Cohort 1 (Early Access)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Exclude Emails (Comma separated)</label>
                        <input type="text" id="wlExclude" placeholder="spam@domain.com, test@usedots.in">
                    </div>
                    <div class="form-group">
                        <label>Add Extra Mailing Addresses (Comma separated)</label>
                        <input type="text" id="wlExtra" placeholder="investors@example.com, pr@example.com">
                    </div>
                    <div class="form-group">
                        <label>Message (Will be wrapped in dots. branding)</label>
                        <textarea id="wlMessage" rows="5" placeholder="Type your update here..." required></textarea>
                    </div>
                    <button type="submit" class="action-btn">Send Notification Broadcast</button>
                </form>
            </div>

            <!-- Custom 1:1 Email Sender -->
            <div class="card">
                <h2>Send Custom Email</h2>
                <form id="customForm">
                    <div class="form-group">
                        <label>Sender Address</label>
                        <input type="email" id="customSender" value="hello@usedots.in" required>
                    </div>
                    <div class="form-group">
                        <label>Recipient Address</label>
                        <input type="email" id="customRecipient" placeholder="user@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="customSubject" placeholder="Welcome to dots." required>
                    </div>
                    <div class="form-group">
                        <label>Message (Will be wrapped in dots. branding)</label>
                        <textarea id="customMessage" rows="5" required></textarea>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="customTrack" checked>
                        <label style="margin:0;">Enable Open & Click Tracking</label>
                    </div>
                    <button type="submit" class="action-btn">Send Custom Email</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
