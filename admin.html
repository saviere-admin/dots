<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dots. | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #050505; color: #fff; }
        .glass-panel { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hidden { display: none !important; }
        .custom-checkbox { width: 18px; height: 18px; accent-color: #D3A354; cursor: pointer; }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden flex items-center justify-center">

    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#050505]">
        <div class="glass-panel p-10 rounded-[2rem] w-full max-w-md text-center shadow-2xl relative">
            <h2 class="text-white font-bold text-3xl tracking-tighter mb-8">dots<span class="text-[#D3A354]">.</span></h2>
            
            <form id="pwdForm" class="block" onsubmit="event.preventDefault(); return false;">
                <h2 class="text-xs font-bold tracking-[0.2em] uppercase text-gray-400 mb-6">System Access</h2>
                <input type="password" id="sysPwd" required placeholder="Admin Password" class="w-full bg-black/50 border border-gray-800 rounded-xl px-4 py-4 text-white text-center mb-4 focus:outline-none focus:border-[#D3A354] transition-colors">
                <button type="submit" id="btnPwd" class="w-full bg-white text-black font-semibold py-4 rounded-xl hover:scale-[1.02] transition-transform">Verify Password</button>
            </form>

            <form id="gitForm" class="hidden" onsubmit="event.preventDefault(); return false;">
                <h2 class="text-xs font-bold tracking-[0.2em] uppercase text-green-400 mb-6">Password Verified</h2>
                <input type="password" id="gitToken" required placeholder="GitHub PAT (ghp_...)" class="w-full bg-black/50 border border-gray-800 rounded-xl px-4 py-4 text-white text-center mb-4 focus:outline-none focus:border-[#D3A354] font-mono text-sm transition-colors">
                <button type="submit" id="btnGit" class="w-full bg-[#D3A354] text-black font-bold py-4 rounded-xl hover:scale-[1.02] transition-transform">Connect Database</button>
            </form>

            <p id="authError" class="text-red-400 text-xs mt-6 hidden bg-red-900/20 p-3 rounded-lg border border-red-900/50"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardView" class="hidden h-full w-full flex flex-col relative">
        <nav class="glass-panel px-8 py-4 flex justify-between items-center sticky top-0 z-40">
            <h2 class="text-white font-bold text-xl tracking-tighter">dots<span class="text-[#D3A354]">.</span></h2>
            <button id="logoutBtn" class="text-xs font-bold uppercase tracking-[0.1em] text-red-400 hover:text-red-300 transition-colors">Lock Terminal</button>
        </nav>

        <div class="flex-1 overflow-hidden flex flex-col max-w-screen-2xl mx-auto w-full p-6">
            
            <div class="flex-1 glass-panel rounded-3xl flex flex-col overflow-hidden relative">
                <div class="p-6 border-b border-white/5 flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-semibold tracking-tight">Waitlist Directory</h2>
                        <p class="text-xs text-gray-400 mt-1">Live D1 SQL Synchronization</p>
                    </div>
                    <div class="flex gap-4 items-center">
                        <span class="text-xs font-bold text-[#D3A354]"><span id="totalCount">0</span> Total Users</span>
                    </div>
                </div>
                
                <div class="flex-1 overflow-y-auto p-0">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-500 uppercase tracking-wider sticky top-0 bg-[#0a0a0a] z-10 border-b border-white/5">
                            <tr>
                                <th class="px-6 py-4 w-12"><input type="checkbox" id="selectAll" class="custom-checkbox"></th>
                                <th class="px-6 py-4 font-medium">Name</th>
                                <th class="px-6 py-4 font-medium">Target Address</th>
                                <th class="px-6 py-4 font-medium text-right">Acquisition Date</th>
                            </tr>
                        </thead>
                        <tbody id="waitlistBody" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>

                <div id="selectionActionBar" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-[#D3A354] text-black px-6 py-3 rounded-full flex items-center gap-6 shadow-2xl transition-all duration-300 translate-y-24 opacity-0 pointer-events-none">
                    <span class="text-sm font-bold"><span id="selectedCount">0</span> Selected</span>
                    <button id="composeBtn" class="bg-black text-white text-xs font-bold uppercase tracking-wider px-5 py-2 rounded-full hover:bg-gray-800 transition-colors">Compose Broadcast</button>
                </div>
            </div>
        </div>

        <!-- Composer Modal -->
        <div id="composerModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
            <div class="w-full max-w-2xl glass-panel rounded-3xl p-8 flex flex-col">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-xl font-semibold tracking-tight">Payload Composer</h2>
                    <button id="closeComposerBtn" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
                </div>
                
                <div id="notifyStatus" class="hidden text-xs p-4 rounded-xl mb-6"></div>

                <form id="notifyForm" class="flex flex-col gap-5" onsubmit="event.preventDefault(); return false;">
                    <div class="bg-black/40 p-4 rounded-xl border border-white/5">
                        <label class="text-xs text-gray-500 uppercase tracking-wider block mb-1">Recipients</label>
                        <div class="text-sm font-medium text-[#D3A354]"><span id="recipientCountLabel">0</span> addresses targeted</div>
                    </div>
                    
                    <div>
                        <input type="text" id="emailSubject" required placeholder="Subject Line" class="w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl focus:outline-none focus:border-[#D3A354] transition text-white">
                    </div>
                    
                    <div>
                        <textarea id="emailBody" required placeholder="HTML Body Content..." rows="8" class="w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl focus:outline-none focus:border-[#D3A354] transition text-white font-mono text-sm resize-none"></textarea>
                    </div>
                    
                    <button type="submit" id="sendBtn" class="w-full bg-[#D3A354] text-black font-bold py-4 rounded-xl hover:scale-[1.02] transition-transform">Dispatch via Resend</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
