<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Notification Console | dots.</title>
  
  <!-- High-Res Vector SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235C071B'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23D8A448'/%3E%3C/svg%3E" />
  <link rel="alternate icon" type="image/png" href="./public/brand/logos/DotsScBWTWS.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />

  <style>
    /* Admin specific layout adjustments */
    body { background-color: #fdfaf6; }
    .admin-container { max-width: 900px; margin: 4rem auto; padding: 0 1.5rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; border-bottom: 1px solid #eaeaea; padding-bottom: 1.5rem; }
    .admin-header img { height: 32px; }
    
    .admin-auth-panel { max-width: 400px; margin: 10vh auto; text-align: center; }
    .admin-auth-panel input { width: 100%; margin: 1rem 0; text-align: center; font-family: monospace; }
    
    .admin-grid { display: grid; gap: 3rem; }
    .admin-card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #eaeaea; }
    .admin-card h2 { margin-top: 0; font-size: 1.25rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    
    .admin-form label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
    .admin-form input[type="text"], .admin-form textarea { width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; }
    .admin-form textarea { resize: vertical; min-height: 150px; font-family: monospace; font-size: 0.85rem; line-height: 1.5; }
    
    .admin-history-item { padding: 1rem 0; border-bottom: 1px solid #eaeaea; }
    .admin-history-item:last-child { border-bottom: none; padding-bottom: 0; }
    .admin-history-item strong { display: block; font-size: 1rem; color: #520a1e; }
    .admin-history-item time { font-size: 0.8rem; color: #666; margin-bottom: 0.5rem; display: block; }
    .admin-history-item .html-preview { font-size: 0.9rem; color: #444; background: #f9f9f9; padding: 0.75rem; border-radius: 6px; margin: 0.5rem 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .admin-history-item small { font-size: 0.8rem; font-weight: 500; color: #2b5d3f; }
    
    .admin-table-wrap { overflow-x: auto; }
    .admin-table { width: 100%; text-align: left; border-collapse: collapse; font-size: 0.9rem; }
    .admin-table th, .admin-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #eaeaea; }
    .admin-table th { font-weight: 600; color: #520a1e; background: #fdfaf6; }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-empty { text-align: center; color: #666; font-style: italic; padding: 2rem 0; }
    
    .status-msg { margin-top: 1rem; font-size: 0.9rem; font-weight: 500; text-align: center; }
  </style>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <a href="/" aria-label="Back to site"><img src="./public/brand/logos/dh/DotsTBBTWoS.png" alt="dots. logo" /></a>
      <span class="eyebrow">Notification Console</span>
    </header>

    <!-- Authentication Panel -->
    <main data-admin-login class="admin-auth-panel">
      <h2>Admin Access</h2>
      <p>Enter your GitHub PAT to unlock the console.</p>
      <input type="password" data-admin-token placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      <button type="button" data-admin-unlock class="button button-primary full-width">Authenticate</button>
      <p class="status-msg" data-admin-status hidden></p>
    </main>

    <!-- Main Dashboard -->
    <main data-admin-console class="admin-grid" hidden>
      
      <!-- Compose Broadcast -->
      <section class="admin-card">
        <h2>Compose Broadcast <span data-admin-audience class="eyebrow" style="margin:0;">Loading audience...</span></h2>
        <form data-admin-form class="admin-form">
          <div>
            <label for="subject">Email Subject</label>
            <input type="text" id="subject" name="subject" placeholder="e.g., The future of oral care is solid." required />
          </div>
          
          <div>
            <label for="message">Email Message (HTML Supported)</label>
            <textarea id="message" name="message" placeholder="<p>Hello from dots.</p><p>We are thrilled to announce...</p>" required></textarea>
          </div>
          
          <button type="submit" class="button button-primary">Send to Active Waitlist</button>
          <p class="status-msg" data-admin-status hidden></p>
        </form>
      </section>

      <!-- Broadcast History -->
      <section class="admin-card">
        <h2>Broadcast History</h2>
        <div data-admin-history>
          <!-- History items injected here via admin.js -->
        </div>
      </section>

      <!-- Waitlist Audience -->
      <section class="admin-card">
        <h2>
          Waitlist Directory
          <button type="button" data-admin-export class="button button-secondary" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">Export CSV</button>
        </h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Interest / Category</th>
                <th>Date Joined</th>
              </tr>
            </thead>
            <tbody data-admin-waitlist>
              <!-- Waitlist rows injected here via admin.js -->
            </tbody>
          </table>
        </div>
      </section>
      
    </main>
    
    <footer class="site-footer" style="margin-top: 4rem; text-align: center; padding: 2rem 0; border-top: 1px solid #eaeaea;">
      <div class="footer-meta" style="justify-content: center;">
        <span>dots. © 2026 All rights reserved. A brand of Savière Group Private Limited.</span>
      </div>
    </footer>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
