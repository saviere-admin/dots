<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dots. | Secure Node</title>
    <style>
        :root {
            --bg: #111111;
            --surface: #ffffff;
            --text-main: #111827;
            --border: #e5e7eb;
            --ios-blue: #007aff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* macOS Style Auth Overlay */
        #authContainer {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: popIn 0.2s ease-out;
            overflow: hidden;
            position: relative;
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .auth-top {
            padding: 20px;
            text-align: center;
        }
        .auth-logo {
            max-width: 80px;
            margin-bottom: 15px;
            background: #000;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .auth-top p {
            margin: 0 0 15px 0;
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }
        
        .input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }
        input.auth-input {
            width: 100%;
            padding: 8px 45px 8px 8px; /* Extra padding on right for the Show button */
            border: 1px solid #8e8e93;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        input.auth-input:focus {
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 1px var(--ios-blue);
        }
        .toggle-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--ios-blue);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
        }

        .auth-buttons {
            display: flex;
            border-top: 1px solid #dbdbdf;
        }
        .auth-buttons button {
            flex: 1;
            background: transparent;
            color: var(--ios-blue);
            border: none;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            padding: 12px;
            transition: background 0.1s;
        }
        .auth-buttons button:hover { background: #f0f0f0; }
        .auth-buttons button:last-child {
            font-weight: 600;
            border-left: 1px solid #dbdbdf;
        }
        
        .auth-footer {
            background-color: #f9fafb;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 10px;
            color: #6b7280;
            border-top: 1px solid #dbdbdf;
        }
        .cf-logo { width: 14px; height: 14px; fill: #F38020; }

        /* Custom Error Modal */
        #customError {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 10001;
            align-items: center;
            justify-content: center;
        }
        .error-dialog {
            background: #ffffff;
            border-radius: 12px;
            width: 280px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid #dbdbdf;
            overflow: hidden;
            animation: popIn 0.15s ease-out;
        }
        .error-message {
            padding: 20px 16px;
            font-size: 13px;
            color: #333;
        }
        .error-actions {
            border-top: 1px solid #dbdbdf;
            padding: 10px 16px;
            display: flex;
            justify-content: flex-end;
            background: #f9fafb;
        }
        .error-actions button {
            background: transparent;
            color: #1a73e8;
            border: 2px solid #8ab4f8;
            border-radius: 4px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .error-actions button:hover { background: #e8f0fe; }

        /* Dashboard Global Styles (Injected post-auth) */
        .dash-body { background-color: #f9fafb; padding: 40px 20px; display: block; height: auto; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
        .logo-container { background-color: #000; padding: 15px; border-radius: 8px; display: inline-flex; }
        .logo { max-width: 120px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card h2 { margin-top: 0; font-size: 1.25rem; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; }
        .dash-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        textarea.dash-input { resize: vertical; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; }
        .action-btn { background-color: #000; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .action-btn:hover { opacity: 0.8; }
        .logout-btn { margin-left: auto; background: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-main); }
        .dash-footer { text-align: center; color: #6b7280; font-size: 12px; margin-top: 40px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Authentication Overlay -->
    <div id="authContainer">
        <form id="authForm">
            <div class="auth-top">
                <img src="https://usedots.in/public/brand/logos/dh/DotsTBWTWoS.png" alt="dots." class="auth-logo">
                
                <!-- Layer 1: Admin Password -->
                <div id="step1">
                    <p>Please enter the Editorial Passcode to access this node:</p>
                    <div class="input-wrapper">
                        <input type="password" id="modalPassword" class="auth-input" placeholder="Admin Password" required>
                        <button type="button" class="toggle-btn" onclick="togglePwd('modalPassword', this)">Show</button>
                    </div>
                </div>
                
                <!-- Layer 2: GitHub PAT (Hidden initially) -->
                <div id="step2" style="display: none;">
                    <p>Passcode verified. Please provide your GitHub PAT:</p>
                    <div class="input-wrapper">
                        <input type="password" id="modalPat" class="auth-input" placeholder="GitHub PAT">
                        <button type="button" class="toggle-btn" onclick="togglePwd('modalPat', this)">Show</button>
                    </div>
                </div>
            </div>
            
            <div class="auth-buttons" id="buttonsStep1">
                <button type="button" onclick="window.location.reload()">Cancel</button>
                <button type="submit">Continue</button>
            </div>
            
            <div class="auth-buttons" id="buttonsStep2" style="display: none;">
                <button type="button" onclick="goBackToStep1()">Back</button>
                <button type="submit">Authenticate</button>
            </div>
            
            <div class="auth-footer">
                <svg class="cf-logo" viewBox="0 0 31.11 10.37" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56,3.87a4,4,0,0,0-3.79-2.73,4.09,4.09,0,0,0-1.61.33,3.31,3.31,0,0,0-6.19.78,2.71,2.71,0,0,0-2.48-1.55,2.77,2.77,0,0,0-2.33,1.26A2.81,2.81,0,0,0,5.7,1.84,2.86,2.86,0,0,0,3.31,3,3.58,3.58,0,0,0,0,6.59v.5H23.09v-.5A3.54,3.54,0,0,0,22.56,3.87Z"/>
                    <path d="M31.11,6.59a3.57,3.57,0,0,0-2.61-3.41,2.83,2.83,0,0,0-3-1.34h0a3.33,3.33,0,0,0-.31,1.15,2.74,2.74,0,0,1,1,2.5,2.86,2.86,0,0,1-1.38,2h.1A2.58,2.58,0,0,1,27.35,8H31.11Z"/>
                    <rect x="0" y="7.5" width="26.79" height="2.87"/>
                </svg>
                Secured by Cloudflare
            </div>
        </form>
    </div>

    <!-- Custom Error Modal -->
    <div id="customError">
        <div class="error-dialog">
            <div class="error-message">Access Denied: Invalid Editorial Passcode.</div>
            <div class="error-actions">
                <button type="button" onclick="closeError()">Close</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Core -->
    <script>
        const HARDCODED_ADMIN_PWD = "9885679895P@$79895w0rd1204002040";
        let memoryAuth = { pwd: '', pat: '' };
        let authStep = 1;

        function togglePwd(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "Hide";
            } else {
                input.type = "password";
                btn.innerText = "Show";
            }
        }

        function triggerError() {
            document.getElementById('customError').style.display = 'flex';
            document.getElementById('modalPassword').value = '';
        }

        function closeError() {
            document.getElementById('customError').style.display = 'none';
            document.getElementById('modalPassword').focus();
        }

        function saveAuth(pwd, pat) {
            try {
                sessionStorage.setItem('dots_admin_pwd', pwd);
                sessionStorage.setItem('dots_github_pat', pat);
            } catch (err) {}
            memoryAuth.pwd = pwd;
            memoryAuth.pat = pat;
        }

        function getAuth(key) {
            try {
                return sessionStorage.getItem(key) || (key === 'dots_admin_pwd' ? memoryAuth.pwd : memoryAuth.pat);
            } catch (err) {
                return key === 'dots_admin_pwd' ? memoryAuth.pwd : memoryAuth.pat;
            }
        }

        function clearAuth() {
            try { sessionStorage.clear(); } catch(err) {}
            memoryAuth = { pwd: '', pat: '' };
        }

        function goBackToStep1() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('buttonsStep2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('buttonsStep1').style.display = 'flex';
            document.getElementById('modalPat').required = false;
            document.getElementById('modalPassword').required = true;
            authStep = 1;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const authForm = document.getElementById('authForm');
            
            if (getAuth('dots_admin_pwd') === HARDCODED_ADMIN_PWD && getAuth('dots_github_pat')) {
                renderDashboard();
            } else if (authForm) {
                authForm.addEventListener('submit', (e) => {
                    e.preventDefault(); 
                    
                    if (authStep === 1) {
                        const pwd = document.getElementById('modalPassword').value.trim();
                        if (pwd !== HARDCODED_ADMIN_PWD) {
                            triggerError();
                            return;
                        }
                        // Transition to Step 2
                        document.getElementById('step1').style.display = 'none';
                        document.getElementById('buttonsStep1').style.display = 'none';
                        document.getElementById('step2').style.display = 'block';
                        document.getElementById('buttonsStep2').style.display = 'flex';
                        document.getElementById('modalPassword').required = false;
                        document.getElementById('modalPat').required = true;
                        document.getElementById('modalPat').focus();
                        authStep = 2;
                    } else if (authStep === 2) {
                        const pwd = document.getElementById('modalPassword').value.trim();
                        const pat = document.getElementById('modalPat').value.trim();
                        
                        if (!pat) {
                            alert("GitHub PAT is required.");
                            return;
                        }
                        
                        saveAuth(pwd, pat);
                        renderDashboard();
                    }
                });
            }
        });

        function renderDashboard() {
            document.title = 'dots. | Editorial Console';
            document.body.className = 'dash-body'; 
            
            document.body.innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="logo-container">
                            <img src="https://usedots.in/public/brand/logos/dh/DotsTBWTWoS.png" alt="dots. logo" class="logo">
                        </div>
                        <h1>Communication Console</h1>
                        <button class="logout-btn" id="logoutBtn">Lock Console</button>
                    </div>

                    <div class="card">
                        <h2>Waitlist & System Notifications</h2>
                        <form id="waitlistForm">
                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" class="dash-input" id="wlSubject" placeholder="Update from dots." required>
                            </div>
                            <div class="form-group">
                                <label>Select Recipients (Hold CMD/CTRL for multiple)</label>
                                <select id="wlRecipients" class="dash-input" multiple size="3">
                                    <option value="all">Entire Waitlist Database</option>
                                    <option value="cohort_1">Cohort 1 (Early Access)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Exclude Emails (Comma separated)</label>
                                <input type="text" class="dash-input" id="wlExclude" placeholder="spam@domain.com">
                            </div>
                            <div class="form-group">
                                <label>Add Extra Mailing Addresses (Comma separated)</label>
                                <input type="text" class="dash-input" id="wlExtra" placeholder="investors@example.com">
                            </div>
                            <div class="form-group">
                                <label>Message Payload (Wrapped in dots. branding)</label>
                                <textarea id="wlMessage" class="dash-input" rows="6" placeholder="Type your update here..." required></textarea>
                            </div>
                            <button type="submit" class="action-btn">Broadcast Notification</button>
                        </form>
                    </div>

                    <div class="card">
                        <h2>Dispatch Custom Email</h2>
                        <form id="customForm">
                            <div class="form-group">
                                <label>Sender Address</label>
                                <input type="email" class="dash-input" id="customSender" value="hello@usedots.in" required>
                            </div>
                            <div class="form-group">
                                <label>Recipient Address</label>
                                <input type="email" class="dash-input" id="customRecipient" placeholder="user@domain.com" required>
                            </div>
                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" class="dash-input" id="customSubject" placeholder="Welcome to dots." required>
                            </div>
                            <div class="form-group">
                                <label>Message Payload (Wrapped in dots. branding)</label>
                                <textarea id="customMessage" class="dash-input" rows="6" required></textarea>
                            </div>
                            <div class="form-group checkbox-group">
                                <input type="checkbox" id="customTrack" checked>
                                <label style="margin:0;">Enable Analytics Tracking</label>
                            </div>
                            <button type="submit" class="action-btn">Dispatch Email</button>
                        </form>
                    </div>
                    
                    <div class="dash-footer">
                        Cruelty-Free &bull; Waterless &bull; Clinical Precision<br>
                        &copy; 2026 dots. All rights reserved. A brand of Savière Group Private Limited.
                    </div>
                </div>
            `;

            bindDashboardEvents();
        }

        function bindDashboardEvents() {
            document.getElementById('logoutBtn').addEventListener('click', () => {
                clearAuth();
                window.location.reload(); 
            });

            document.getElementById('waitlistForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerText;
                btn.innerText = 'Dispatching...';

                const payload = {
                    type: 'notification',
                    subject: document.getElementById('wlSubject').value,
                    targetList: Array.from(document.getElementById('wlRecipients').selectedOptions).map(o => o.value),
                    extraEmails: document.getElementById('wlExtra').value.split(',').map(email => email.trim()).filter(Boolean),
                    excludeEmails: document.getElementById('wlExclude').value.split(',').map(email => email.trim()).filter(Boolean),
                    message: document.getElementById('wlMessage').value
                };

                await dispatchEmail(payload);
                btn.innerText = originalText;
            });

            document.getElementById('customForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerText;
                btn.innerText = 'Dispatching...';

                const payload = {
                    type: 'custom',
                    sender: document.getElementById('customSender').value,
                    recipient: document.getElementById('customRecipient').value,
                    subject: document.getElementById('customSubject').value,
                    message: document.getElementById('customMessage').value,
                    trackOpens: document.getElementById('customTrack').checked
                };

                await dispatchEmail(payload);
                btn.innerText = originalText;
            });
        }

        async function dispatchEmail(payload) {
            try {
                const response = await fetch('/api/send-mail', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Password': getAuth('dots_admin_pwd') || '',
                        'X-GitHub-Pat': getAuth('dots_github_pat') || ''
                    },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    alert('Email dispatched successfully.');
                } else if (response.status === 401 || response.status === 403) {
                    alert('Authentication failed at Edge. Session invalidated.');
                    clearAuth();
                    window.location.reload(); 
                } else {
                    const errData = await response.text();
                    alert(`Failed to send: ${errData}`);
                }
            } catch (err) {
                console.error(err);
                alert('Network error. Check console for details.');
            }
        }
    </script>
</body>
</html>
